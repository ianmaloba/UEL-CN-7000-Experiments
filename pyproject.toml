[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uel-cn-7000-experiments"
version = "0.1.0"
description = "Reproducible experiments for LLM code-generation robustness under distribution shift"
requires-python = ">=3.11"
dependencies = [
    "docground @ git+https://github.com/ianmaloba/DocGround.git",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real model calls (skipped unless explicitly enabled)",
]

[tool.setuptools.packages.find]
include = ["experiments*"]
